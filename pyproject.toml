[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "optiondesk"
version = "0.1.0"
description = "A starting point for building your own intraday options trading platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaleb Hoffer" }]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
keywords = ["options", "trading", "algorithmic-trading", "schwab", "backtesting", "quant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial :: Investment",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]

[project.scripts]
optiondesk = "optiondesk.cli:main"

[project.urls]
Homepage = "https://github.com/kalebhoffer/optiondesk"
Issues = "https://github.com/kalebhoffer/optiondesk/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/optiondesk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
